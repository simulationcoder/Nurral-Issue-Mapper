name: release
# Builds binaries for Linux, macOS and Windows when a version tag is pushed and
# attaches them, with checksums, to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/release.sh "${GITHUB_REF_NAME}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
